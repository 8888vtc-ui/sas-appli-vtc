<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VTC Pro Console — Outil complet de gestion VTC : bons de commande, facturation, coffre-fort documentaire, accueil aéroport. Conforme au décret d'août 2025." />
    <meta name="author" content="David Chemla" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>VTC Pro Console — Gestion Complète VTC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
      // Remove Netlify injected badge/drawer
      function removeNetlifyBadge() {
        document.querySelectorAll(
          '[id*="netlify"], [class*="netlify"], [class*="Netlify"], [data-netlify-drawer], iframe[src*="netlify"], a[href*="netlify.com"]'
        ).forEach(function(el) {
          if (el && el.id !== 'root') el.remove();
        });
      }
      // Run immediately, after load, and watch for late injections
      removeNetlifyBadge();
      window.addEventListener('load', removeNetlifyBadge);
      setTimeout(removeNetlifyBadge, 1000);
      setTimeout(removeNetlifyBadge, 3000);
      setTimeout(removeNetlifyBadge, 6000);
      new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(n) {
            if (n.nodeType === 1) {
              var el = n;
              var id = (el.id || '').toLowerCase();
              var cls = (el.className || '').toString().toLowerCase();
              if (id.indexOf('netlify') !== -1 || cls.indexOf('netlify') !== -1) {
                el.remove();
              }
            }
          });
        });
      }).observe(document.body || document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
